<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Scout Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 20px;
        color: #0f172a;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 4px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #0f172a;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1e293b;
      }
      button:focus-visible {
        outline: 2px solid #0a66c2;
        outline-offset: 2px;
      }
      button.secondary {
        background: #fff;
        color: #0f172a;
        border: 1px solid #cbd5e1;
      }
      button.secondary:hover {
        background: #f1f5f9;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 20px;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        min-height: 18px;
      }
      #status.ok {
        color: #059669;
      }
      #status.err {
        color: #dc2626;
      }
      p.hint {
        font-size: 12px;
        color: #64748b;
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Job Scout</h1>

    <label for="apiKey">API key</label>
    <div class="row">
      <input id="apiKey" type="password" placeholder="jsk_..." autocomplete="off" />
      <button id="reveal" class="secondary" type="button">Show</button>
    </div>
    <p class="hint">Generate one in Job Scout under Setup &rarr; Resume &rarr; Chrome Extension.</p>

    <label for="baseUrl">Backend URL</label>
    <input id="baseUrl" type="text" placeholder="https://jobscout.oakworks.ai" />

    <div class="actions">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test connection</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>

    <script src="options.js"></script>
  </body>
</html>
